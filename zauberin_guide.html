   </div>
   <div>
    <div class="sc"><h3>Kampf</h3>
     <div class="stats"><div class="st"><div class="b">${13+dex}</div><div class="l">RK</div></div><div class="st"><div class="b">${sg(dex)}</div><div class="l">Initiative</div></div><div class="st"><div class="b">${r.speed} ft</div><div class="l">Bewegung</div></div><div class="st"><div class="b">${hpm}</div><div class="l">TP max</div></div></div>
     <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="st"><input type="number" data-vol value="${esc(S.hp)}" oninput="S.hp=this.value;save()"><div class="l">TP aktuell</div></div>
      <div class="st"><input type="number" data-vol value="${esc(S.thp)}" oninput="S.thp=this.value;save()"><div class="l">Temp. TP</div></div>
      <div class="st"><input type="number" data-vol value="${esc(S.hd)}" oninput="S.hd=this.value;save()" style="width:45%"> <b style="font-size:14px">/ ${L()}W6</b><div class="l">Trefferwürfel</div></div></div>
     <div style="display:flex;gap:14px;font-size:11px;color:var(--tx2);align-items:center;flex-wrap:wrap">Todesrettung: Erfolge <span class="dots">${[1,2,3].map(n=>`<input type="checkbox" class="dot" data-vol ${S.ds["s"+n]?"checked":""} onchange="S.ds['s${n}']=this.checked;save()">`).join("")}</span> Fehlschläge <span class="dots">${[1,2,3].map(n=>`<input type="checkbox" class="dot fail" data-vol ${S.ds["f"+n]?"checked":""} onchange="S.ds['f${n}']=this.checked;save()">`).join("")}</span></div>
    </div>
    <div class="sc"><h3>Angriffe</h3><table><tr><th>Angriff</th><th>Bonus/SG</th><th>Schaden</th></tr>${atkCantrips}<tr><td><b>${weapon[0]}</b></td><td>${weapon[1]}</td><td>${weapon[2]}</td></tr><tr><td><b>Dolch (2)</b></td><td>${sg(P+dex)}</td><td>1W4 ${sg(dex)} Stich · Wurf 20/60 ft</td></tr></table></div>
    <div class="sc long"><h3>Zauberei (Charisma)</h3>
     <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="st"><div class="b">${dc}</div><div class="l">Zauber-SG</div></div><div class="st"><div class="b">${sg(atk)}</div><div class="l">Zauberangriff</div></div><div class="st"><div class="dots" style="justify-content:center;min-height:24px">${spDots}</div><div class="l">Zauberpunkte (${spMax})</div></div></div>
     ${slots}
     <h3 style="margin-top:8px">Zaubertricks</h3>${spCard(S.cantrips)}
     <h3 style="margin-top:8px">Zauber</h3>${spCard([...S.spells].sort((a,b)=>SP[a][1]-SP[b][1]))}
     <div class="ft" style="margin-top:6px;color:var(--tx2)">K = Konzentration: nur ein solcher Zauber gleichzeitig; bei Schaden KON-Rettungswurf (SG 10 oder halber Schaden).</div>
    </div>
   </div>
   <div>
    <div class="sc" style="background:var(--pu-soft)"><h3>Dein Zug</h3><div class="ft"><b>Bewegung</b> bis ${r.speed} ft · <b>Aktion</b>: Zauber, Angriff, Spurt, Ausweichen · <b>Bonusaktion</b>: nur wenn etwas sie erlaubt · <b>Reaktion</b>: einmal pro Runde, z. B. Schild.<p>Zauberst du als Bonusaktion, darfst du im selben Zug als Aktion nur einen Zaubertrick wirken.</p></div></div>
    <div class="sc"><h3>Merkmale</h3>
     <div class="ft"><b>Drachenahn: ${dr[0]} (${dr[1]})</b><p>Drakonisch sprechen, lesen, schreiben. Bei CHA-Proben mit Drachen doppelter Übungsbonus.</p></div>
     <div class="ft"><b>Drakonische Widerstandskraft</b><p>+1 TP pro Stufe (eingerechnet). Ohne Rüstung: RK 13 + GES.</p></div>
     ${L()>=2?`<div class="ft"><b>Quelle der Magie</b><p>${spMax} Zauberpunkte. Bonusaktion: Platz Grad 1 kostet 2 Punkte, Grad 2 kostet 3. Einen Platz in Punkte umwandeln (Punkte = Grad).</p></div>`:""}
     ${L()>=3?`<div class="ft"><b>Metamagie</b></div>${metaTxt}`:""}
     <div class="ft"><b>${r.n}</b><p>${r.traits.join(" · ")}</p></div>
     <div class="ft"><b>${b.n}</b><p>${b.f}</p></div>
    </div>
    <div class="sc"><h3>Ausrüstung</h3><div class="ft">${eq.join("<br>")}<br>2 Dolche<br>${b.e}</div>
     <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px">${["KM","SM","EM","GM","PM"].map(c=>`<div style="text-align:center;font-size:10px;color:var(--tx2)">${c}<input class="vol" data-vol type="number" value="${esc(S.coins[c]||"")}" oninput="S.coins['${c}']=this.value;save()"></div>`).join("")}</div></div>
    <div class="sc"><h3>Zustände &amp; Notizen</h3><textarea class="vol" data-vol style="min-height:50px" oninput="S.cond=this.value;save()">${esc(S.cond)}</textarea><div class="ptext" data-vol>${esc(S.cond)}</div></div>
    ${S.appearance||S.story?`<div class="sc"><h3>Aussehen &amp; Geschichte</h3><div class="ft">${esc(S.appearance)}</div><div class="ft">${esc(S.story).replace(/\n/g,"<br>")}</div></div>`:""}
   </div>
  </div></div>`;
  save();
}
function longRest(){S.hp=hpMax();S.thp="";S.hd=Math.min(L(),(parseInt(S.hd)||0)+Math.max(1,Math.floor(L()/2)));S.slotsUsed={};S.spUsed=0;S.ds={};save();render();}
/* ================= AUSFÜHRLICHE ZAUBERTEXTE (Anhang) ================= */
// s=Schule, k=Komponenten, dur=Dauer, t=Beschreibung, h=Höhere Grade / Stufen, tip=Spieltipp
const LONG={
 feuerpfeil:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Du schleuderst einen Feuerfunken auf eine Kreatur oder ein Objekt in Reichweite. Mache einen Fernkampf-Zauberangriff. Bei einem Treffer erleidet das Ziel 1W10 Feuerschaden. Ein brennbares Objekt, das niemand trägt oder hält, fängt Feuer.",h:"Schaden steigt auf 2W10 (Stufe 5), 3W10 (Stufe 11) und 4W10 (Stufe 17).",tip:"Dein Standardangriff, wenn du keine Zauberplätze ausgeben willst. Mit Verdoppeltem Zauber für 1 Punkt auf zwei Ziele."},
 froststrahl:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Ein eisblauer Strahl trifft eine Kreatur in Reichweite. Mache einen Fernkampf-Zauberangriff. Bei einem Treffer erleidet das Ziel 1W8 Kälteschaden, und seine Bewegungsrate sinkt bis zum Beginn deines nächsten Zuges um 10 ft.",h:"2W8 (Stufe 5), 3W8 (Stufe 11), 4W8 (Stufe 17).",tip:"Gut, um Gegner auf Abstand zu halten oder Fliehende zu bremsen."},
 schockgriff:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Blitze springen von deiner Hand auf eine Kreatur, die du berührst. Mache einen Nahkampf-Zauberangriff. Trägt das Ziel eine Rüstung aus Metall, hast du Vorteil. Bei einem Treffer erleidet es 1W8 Blitzschaden und kann bis zum Beginn seines nächsten Zuges keine Reaktionen ausführen.",h:"2W8 (Stufe 5), 3W8 (Stufe 11), 4W8 (Stufe 17).",tip:"Steht ein Gegner neben dir: Schockgriff, dann weglaufen. Ohne Reaktion kann er dir keinen Gelegenheitsangriff verpassen."},
 erfrierung:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Eisige Kälte bildet sich auf einer Kreatur, die du in Reichweite siehst. Das Ziel macht einen Konstitutions-Rettungswurf. Bei einem Fehlschlag erleidet es 1W6 Kälteschaden und hat Nachteil beim nächsten Waffenangriff, den es vor dem Ende seines nächsten Zuges ausführt.",h:"2W6 (Stufe 5), 3W6 (Stufe 11), 4W6 (Stufe 17).",tip:"Gegen flinke Ziele mit hoher RK, weil kein Angriffswurf nötig ist."},
 kaltehand:{s:"Nekromantie",k:"V, G",dur:"1 Runde",t:"Eine geisterhafte Skeletthand erscheint bei einer Kreatur in Reichweite. Mache einen Fernkampf-Zauberangriff. Bei einem Treffer erleidet das Ziel 1W8 nekrotischen Schaden und kann bis zum Beginn deines nächsten Zuges keine Trefferpunkte zurückgewinnen. Ist das Ziel untot, hat es außerdem bis zum Ende deines nächsten Zuges Nachteil auf Angriffswürfe gegen dich.",h:"2W8 (Stufe 5), 3W8 (Stufe 11), 4W8 (Stufe 17).",tip:"Stark gegen Untote und gegen Gegner, die sich heilen."},
 giftspritzer:{s:"Beschwörung",k:"V, G",dur:"Sofort",t:"Du streckst die Hand aus und stößt eine Wolke giftigen Gases gegen eine Kreatur in Reichweite. Sie macht einen Konstitutions-Rettungswurf und erleidet bei einem Fehlschlag 1W12 Giftschaden.",h:"2W12 (Stufe 5), 3W12 (Stufe 11), 4W12 (Stufe 17).",tip:"Viele Monster (z. B. Untote, Konstrukte) sind gegen Gift immun. Frag im Zweifel die SL."},
 saeure:{s:"Beschwörung",k:"V, G",dur:"Sofort",t:"Du schleuderst eine Säureblase. Wähle eine Kreatur in Reichweite oder zwei Kreaturen, die höchstens 5 ft voneinander entfernt stehen. Jedes Ziel macht einen Geschicklichkeits-Rettungswurf und erleidet bei einem Fehlschlag 1W6 Säureschaden.",h:"2W6 (Stufe 5), 3W6 (Stufe 11), 4W6 (Stufe 17).",tip:"Trifft zwei Gegner gleichzeitig, wenn sie nebeneinanderstehen."},
 licht:{s:"Hervorrufung",k:"V, M (ein Glühwürmchen oder phosphoreszierendes Moos)",dur:"1 Stunde",t:"Du berührst ein Objekt, das höchstens 10 ft groß ist. Es strahlt helles Licht im Umkreis von 20 ft und dämmriges Licht für weitere 20 ft aus, in einer Farbe deiner Wahl. Wird es mit etwas Undurchsichtigem vollständig bedeckt, ist das Licht blockiert. Der Zauber endet, wenn du ihn erneut wirkst oder als Aktion beendest. Hält ein Gegner das Objekt, muss er einen Geschicklichkeits-Rettungswurf bestehen, um dem Zauber zu entgehen.",tip:"Unverzichtbar in Höhlen und Gewölben, falls niemand in der Gruppe Dunkelsicht hat."},
 magierhand:{s:"Beschwörung",k:"V, G",dur:"1 Minute",t:"Eine geisterhafte, schwebende Hand erscheint an einem Punkt in Reichweite. Mit deiner Aktion steuerst du sie: Sie bewegt sich bis zu 30 ft und kann Gegenstände bis etwa 5 kg bewegen, Türen und Behälter öffnen, Dinge aus offenen Behältern holen oder etwas ausgießen. Sie kann nicht angreifen, keine magischen Gegenstände aktivieren und nichts tragen, das schwerer ist. Entfernt sie sich mehr als 30 ft von dir oder wirkst du den Zauber erneut, verschwindet sie.",tip:"Öffne verdächtige Truhen und Türen aus sicherer Entfernung (Fallen!)."},
 botschaft:{s:"Verwandlung",k:"V, G, M (ein kurzes Stück Kupferdraht)",dur:"1 Runde",t:"Du zeigst auf eine Kreatur in Reichweite und flüsterst eine Nachricht. Nur das Ziel hört sie und kann flüsternd antworten, nur du hörst die Antwort. Du kannst den Zauber auch durch Hindernisse wirken, wenn du weißt, wo das Ziel ist. Magische Stille, 1 ft Stein, 1 Zoll Metall, eine dünne Bleischicht oder 3 ft Holz blockieren ihn.",tip:"Heimliche Absprachen während Verhandlungen oder beim Schleichen."},
 illusion:{s:"Illusion",k:"G, M (ein Stückchen Vlies)",dur:"1 Minute",t:"Du erschaffst ein Geräusch oder das Bild eines Objekts an einem Punkt in Reichweite. Ein Geräusch kann ein Flüstern oder ein Schrei sein, bis zur Lautstärke eines brüllenden Löwen. Ein Bild darf nicht größer als ein 5-ft-Würfel sein und erzeugt weder Licht noch Geruch oder Geräusch. Wer das Bild berührt, merkt sofort, dass es eine Illusion ist. Eine Kreatur kann ihre Aktion nutzen, um die Illusion zu untersuchen: Sie würfelt Intelligenz (Nachforschungen) gegen deinen Zauber-SG.",tip:"Eine Kiste als Versteck, Schritte als Ablenkung, eine Wand vor einer Nische. Kreativität lohnt sich."},
 taschensp:{s:"Verwandlung",k:"V, G",dur:"Bis zu 1 Stunde",t:"Ein kleiner Zaubertrick, wähle einen Effekt: harmlose Funken oder ein Windhauch; eine Kerze, Fackel oder ein kleines Lagerfeuer entzünden oder löschen; ein Objekt (bis 1 Kubikfuß) säubern oder beschmutzen; nicht lebendes Material (bis 1 Kubikfuß) für 1 Stunde kühlen, wärmen oder würzen; ein kleines Symbol oder eine Farbe für 1 Stunde auf einem Objekt erscheinen lassen; ein kleines Schmuckstück oder Trugbild erschaffen, das bis zum Ende deines nächsten Zuges hält. Bis zu drei dauerhafte Effekte können gleichzeitig aktiv sein.",tip:"Rollenspiel-Gold: dein Drachenblut zeigen (Funken, warme Hände, glühende Augen)."},
 freunde:{s:"Verzauberung",k:"G, M (etwas Schminke)",dur:"Konzentration, bis zu 1 Minute",t:"Für die Dauer hast du Vorteil auf alle Charisma-Proben gegen eine Kreatur deiner Wahl, die dir nicht feindlich gesinnt ist. Wenn der Zauber endet, merkt die Kreatur, dass du sie magisch beeinflusst hast, und wird dir gegenüber feindlich. Je nach Art reagiert sie gewaltsam oder auf andere Weise.",tip:"Nur einsetzen, wenn du die Person danach nicht mehr brauchst!"},
 geschoss:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Du erschaffst drei leuchtende Pfeile aus magischer Kraft. Jeder trifft automatisch eine Kreatur deiner Wahl in Reichweite, die du sehen kannst, und verursacht 1W4 + 1 Energieschaden. Alle Pfeile treffen gleichzeitig, du kannst sie auf ein oder mehrere Ziele verteilen.",h:"+1 Pfeil pro Platzgrad über 1.",tip:"Trifft immer: perfekt, um einen fast toten Gegner zu erledigen oder Konzentration zu brechen (jeder Pfeil ist ein eigener Rettungswurf)."},
 schild:{s:"Bannmagie",k:"V, G",dur:"1 Runde",zeit:"1 Reaktion, wenn du von einem Angriff getroffen wirst oder Ziel von Magisches Geschoss bist",t:"Eine unsichtbare Barriere schützt dich. Bis zum Beginn deines nächsten Zuges erhältst du +5 auf deine RK, auch gegen den auslösenden Angriff. Du nimmst außerdem keinen Schaden durch Magisches Geschoss.",tip:"Sag deiner SL: „Trifft ein 17er? Dann Schild!“ Deine RK steigt rückwirkend, oft wird aus dem Treffer ein Fehlschlag."},
 brennhaende:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Ein Fächer aus Flammen schießt aus deinen Fingerspitzen. Jede Kreatur in einem 15-ft-Kegel macht einen Geschicklichkeits-Rettungswurf. Bei einem Fehlschlag erleidet sie 3W6 Feuerschaden, bei einem Erfolg die Hälfte. Brennbare Objekte im Bereich, die niemand trägt, fangen Feuer.",h:"+1W6 pro Platzgrad über 1.",tip:"Pass auf, dass keine Verbündeten im Kegel stehen."},
 donnerwoge:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Eine Welle aus Donnerkraft geht von dir aus. Jede Kreatur in einem 15-ft-Würfel, der von dir ausgeht, macht einen Konstitutions-Rettungswurf. Bei einem Fehlschlag erleidet sie 2W8 Schallschaden und wird 10 ft von dir weggestoßen, bei einem Erfolg halben Schaden und wird nicht gestoßen. Lose Objekte im Bereich werden ebenfalls weggestoßen. Der Donner ist bis zu 300 ft weit zu hören.",h:"+1W8 pro Platzgrad über 1.",tip:"Befreiungsschlag, wenn du umzingelt bist, oder um Gegner von Klippen zu stoßen."},
 schlaf:{s:"Verzauberung",k:"V, G, M (eine Prise Sand, Rosenblätter oder eine Grille)",dur:"1 Minute",t:"Würfle 5W8: So viele Trefferpunkte an Kreaturen schläfst du ein. Betroffen sind Kreaturen in einem Radius von 20 ft um einen Punkt in Reichweite, beginnend mit der Kreatur mit den wenigsten aktuellen TP. Jede Kreatur fällt bewusstlos um, ihre TP werden vom Wurf abgezogen, dann ist die nächste dran. Reicht der Rest nicht für die nächste Kreatur, endet es. Schlafende wachen auf, wenn sie Schaden nehmen oder jemand sie mit einer Aktion weckt. Untote und Kreaturen, die nicht bezaubert werden können, sind nicht betroffen.",h:"+2W8 pro Platzgrad über 1.",tip:"Kein Rettungswurf! Auf niedrigen Stufen kann er einen ganzen Kampf beenden. Ist auch gut, um Gegner gefangen zu nehmen."},
 eismesser:{s:"Beschwörung",k:"G, M (ein Tropfen Wasser oder ein Stück Eis)",dur:"Sofort",t:"Du schleuderst einen Eissplitter auf eine Kreatur in Reichweite. Mache einen Fernkampf-Zauberangriff. Bei einem Treffer erleidet das Ziel 1W10 Stichschaden. Treffer oder nicht: Der Splitter explodiert. Das Ziel und jede Kreatur im Umkreis von 5 ft machen einen Geschicklichkeits-Rettungswurf und erleiden bei einem Fehlschlag 2W6 Kälteschaden.",h:"+1W6 Kälteschaden pro Platzgrad über 1 (nur die Explosion).",tip:"Explodiert auch bei einem Fehlschuss. Gut gegen Gegnergruppen."},
 kugel:{s:"Hervorrufung",k:"V, G, M (ein Diamant im Wert von mindestens 50 GM)",dur:"Sofort",t:"Du schleuderst eine Energiekugel auf eine Kreatur in Reichweite. Wähle Säure, Kälte, Feuer, Blitz, Gift oder Schall als Schadensart und mache einen Fernkampf-Zauberangriff. Bei einem Treffer erleidet das Ziel 3W8 Schaden der gewählten Art.",h:"+1W8 pro Platzgrad über 1.",tip:"Du kannst die Resistenzen eines Gegners umgehen. Den Diamanten musst du besitzen, er wird aber nicht verbraucht."},
 absorb:{s:"Bannmagie",k:"G",dur:"1 Runde",zeit:"1 Reaktion, wenn du Säure-, Kälte-, Feuer-, Blitz- oder Schallschaden erleidest",t:"Der Zauber fängt einen Teil der Energie ab. Du hast bis zum Beginn deines nächsten Zuges Resistenz gegen die auslösende Schadensart, auch gegen den auslösenden Schaden (du nimmst also nur die Hälfte). Trifft dich in deinem nächsten Zug ein Nahkampfangriff von dir, verursacht er zusätzlich 1W6 Schaden dieser Art.",h:"+1W6 Bonusschaden pro Platzgrad über 1.",tip:"Gegen Drachenodem und Feuerbälle: halbiert den Schaden sofort."},
 bezaubern:{s:"Verzauberung",k:"V, G",dur:"1 Stunde",t:"Ein Humanoider in Reichweite, den du sehen kannst, macht einen Weisheits-Rettungswurf. Kämpfst du oder deine Gefährten gerade gegen ihn, hat er Vorteil. Bei einem Fehlschlag ist er bezaubert, bis der Zauber endet oder du bzw. deine Gefährten ihm schaden. Er betrachtet dich als freundliche Bekannte. Endet der Zauber, weiß er, dass du ihn bezaubert hast.",h:"+1 Ziel pro Platzgrad über 1 (alle innerhalb von 30 ft zueinander).",tip:"Bezaubert heißt nicht Sklave: Er hilft dir wie einer Freundin, tut aber nichts Selbstzerstörerisches."},
 nebelwolke:{s:"Beschwörung",k:"V, G",dur:"Konzentration, bis zu 1 Stunde",t:"Eine Kugel aus dichtem Nebel mit 20 ft Radius entsteht an einem Punkt in Reichweite. Sie breitet sich um Ecken aus, der Bereich ist stark verschleiert (man sieht nichts hindurch). Ein mäßiger Wind (mind. 10 mph) zerstreut sie.",h:"Radius +20 ft pro Platzgrad über 1.",tip:"Fernkämpfer können nicht mehr zielen, und die Gruppe kann ungesehen fliehen."},
 federfall:{s:"Verwandlung",k:"V, M (eine kleine Feder oder Daune)",dur:"1 Minute",zeit:"1 Reaktion, wenn du oder eine Kreatur in 60 ft fällt",t:"Wähle bis zu fünf fallende Kreaturen in Reichweite. Ihre Fallgeschwindigkeit sinkt auf 60 ft pro Runde. Landet eine Kreatur, bevor der Zauber endet, nimmt sie keinen Fallschaden und landet auf den Füßen. Danach endet der Zauber für sie.",tip:"Klippen, Türme und Observatorien: Auf Stormwreck Isle gibt es genug Gelegenheiten zu fallen."},
 rueckzug:{s:"Verwandlung",k:"V, G",dur:"Konzentration, bis zu 10 Minuten",zeit:"1 Bonusaktion",t:"Du bewegst dich unglaublich schnell. Wenn du den Zauber wirkst und danach in jedem deiner Züge, kannst du als Bonusaktion die Spurt-Aktion ausführen.",tip:"Flucht oder schnell einen Verbündeten erreichen. Kostet die Konzentration."},
 magentd:{s:"Erkenntnis",k:"V, G",dur:"Konzentration, bis zu 10 Minuten",t:"Für die Dauer spürst du die Anwesenheit von Magie im Umkreis von 30 ft. Spürst du Magie, kannst du mit deiner Aktion eine schwache Aura um sichtbare magische Kreaturen oder Objekte erkennen und erfährst ihre Schule der Magie. Der Zauber durchdringt die meisten Hindernisse, wird aber von 1 ft Stein, 1 Zoll Metall, einer dünnen Bleischicht oder 3 ft Holz oder Erde blockiert.",tip:"Andere Klassen wirken das als Ritual ohne Platz, du nicht. Vielleicht kann das jemand anderes in der Gruppe übernehmen."},
 strahl:{s:"Hervorrufung",k:"V, G",dur:"Sofort",t:"Du erschaffst drei Feuerstrahlen und schleuderst sie auf Ziele in Reichweite, auf eines oder mehrere. Mache für jeden Strahl einen eigenen Fernkampf-Zauberangriff. Jeder Treffer verursacht 2W6 Feuerschaden.",h:"+1 Strahl pro Platzgrad über 2.",tip:"Bis zu 6W6 Schaden auf ein Ziel. Stark mit Machtvollem Zauber."},
 nebelschritt:{s:"Beschwörung",k:"V",dur:"Sofort",zeit:"1 Bonusaktion",t:"Silbriger Nebel umhüllt dich kurz und du teleportierst dich bis zu 30 ft weit an einen freien Ort, den du sehen kannst.",tip:"Bonusaktion: Erst wegteleportieren, dann noch einen Zaubertrick wirken. Gegen Fesseln, Netze und Umzingelung."},
 zerbersten:{s:"Hervorrufung",k:"V, G, M (ein Splitter Glimmer)",dur:"Sofort",t:"Ein schmerzhaft lautes Klingen bricht an einem Punkt in Reichweite los. Jede Kreatur in einer Kugel mit 10 ft Radius macht einen Konstitutions-Rettungswurf und erleidet bei einem Fehlschlag 3W8 Schallschaden, bei einem Erfolg die Hälfte. Kreaturen aus anorganischem Material (Stein, Kristall, Metall) haben Nachteil. Nicht getragene Objekte im Bereich nehmen ebenfalls Schaden.",h:"+1W8 pro Platzgrad über 2.",tip:"Stark gegen Konstrukte und Steinwesen. Sehr laut, Heimlichkeit ist danach vorbei."},
 drachenodem:{s:"Verwandlung",k:"V, G, M (eine scharfe Pfefferschote)",dur:"Konzentration, bis zu 1 Minute",zeit:"1 Bonusaktion",t:"Du berührst eine bereitwillige Kreatur (auch dich selbst) und gibst ihr die Macht, Energie wie ein Drache auszuatmen. Wähle Säure, Kälte, Feuer, Blitz oder Gift. Bis der Zauber endet, kann die Kreatur mit ihrer Aktion einen 15-ft-Kegel ausatmen. Jede Kreatur darin macht einen Geschicklichkeits-Rettungswurf gegen deinen Zauber-SG und erleidet 3W6 Schaden der gewählten Art, bei einem Erfolg die Hälfte.",h:"+1W6 pro Platzgrad über 2.",tip:"Gib ihn einem Verbündeten ohne gute Angriffe (z. B. Flaum!) oder nutze ihn jede Runde selbst."},
 spiegel:{s:"Illusion",k:"V, G",dur:"1 Minute",t:"Drei Trugbilder von dir erscheinen und bewegen sich mit dir, sodass man nicht erkennt, welche du bist. Wird ein Angriff gegen dich gemacht, würfle einen W20: Bei 3 Bildern trifft der Angriff ein Bild bei 6 oder mehr, bei 2 Bildern bei 8 oder mehr, bei 1 Bild bei 11 oder mehr. Ein Bild hat RK 10 + dein GES-Modifikator und verschwindet, wenn es getroffen wird. Kreaturen, die nicht auf Sicht angewiesen sind (Blindsicht, Wahrer Blick), sind nicht betroffen.",tip:"Keine Konzentration: Du kannst gleichzeitig einen anderen Konzentrationszauber halten."},
 unsicht:{s:"Illusion",k:"V, G, M (eine Wimper in Gummiarabikum)",dur:"Konzentration, bis zu 1 Stunde",t:"Eine Kreatur, die du berührst, wird mit allem, was sie trägt, unsichtbar. Der Zauber endet für sie, sobald sie angreift oder einen Zauber wirkt.",h:"+1 Ziel pro Platzgrad über 2.",tip:"Zum Kundschaften, Fliehen oder um einen Verbündeten unbemerkt irgendwohin zu bringen."},
 festhalten:{s:"Verzauberung",k:"V, G, M (ein kleines, gerades Stück Eisen)",dur:"Konzentration, bis zu 1 Minute",t:"Ein Humanoider in Reichweite, den du siehst, macht einen Weisheits-Rettungswurf. Bei einem Fehlschlag ist er gelähmt. Am Ende jedes seiner Züge darf er erneut würfeln, bei einem Erfolg endet der Zauber für ihn.",h:"+1 Ziel pro Platzgrad über 2 (innerhalb von 30 ft zueinander).",tip:"Nahkampfangriffe gegen Gelähmte sind automatisch kritische Treffer. Sag deinen Kämpfern Bescheid!"},
 einfluest:{s:"Verzauberung",k:"V, M (eine Schlangenzunge und etwas Honigwabe oder süßes Öl)",dur:"Konzentration, bis zu 8 Stunden",t:"Du schlägst einer Kreatur in Reichweite, die dich hören und verstehen kann, eine Handlung vor (ein bis zwei Sätze), die vernünftig klingt. Sie macht einen Weisheits-Rettungswurf und befolgt den Vorschlag bei einem Fehlschlag, so gut sie kann. Offensichtlich schädliche Vorschläge beenden den Zauber. Der Zauber endet, wenn die Handlung erledigt ist oder du bzw. deine Gefährten der Kreatur schaden. Kreaturen, die nicht bezaubert werden können, sind immun.",tip:"„Die Wachen sollten jetzt Pause machen.“ Formuliere den Vorschlag so, dass er sinnvoll klingt."},
 netz:{s:"Beschwörung",k:"V, G, M (ein Stück Spinnennetz)",dur:"Konzentration, bis zu 1 Stunde",t:"Dicke Spinnweben füllen einen 20-ft-Würfel an einem Punkt in Reichweite. Sie müssen zwischen zwei festen Punkten (Wände, Bäume) verankert sein, sonst fallen sie zu einer 5 ft dicken Schicht zusammen. Der Bereich ist schwieriges Gelände und leicht verschleiert. Wer seinen Zug darin beginnt oder ihn betritt, macht einen Geschicklichkeits-Rettungswurf und ist bei einem Fehlschlag festgesetzt. Ein Festgesetzter kann mit seiner Aktion eine Stärkeprobe gegen deinen SG machen, um sich zu befreien. Die Netze sind brennbar: Ein 5-ft-Würfel brennt in einer Runde ab und verursacht 2W4 Feuerschaden.",tip:"Ideal in Gängen und Höhlen. Mit Feuer kombiniert kannst du Gegner gleich verbrennen."},
 verschw:{s:"Illusion",k:"V",dur:"Konzentration, bis zu 1 Minute",t:"Dein Körper verschwimmt und flackert. Alle Angriffswürfe gegen dich haben Nachteil. Kreaturen mit Blindsicht oder Wahrem Blick, oder solche, die Illusionen durchschauen, sind nicht betroffen.",tip:"Gut, wenn die Gegner dich gezielt angreifen. Kombinierbar mit Schild."},
 vergroess:{s:"Verwandlung",k:"V, G, M (eine Prise Eisenpulver)",dur:"Konzentration, bis zu 1 Minute",t:"Eine Kreatur oder ein nicht getragenes Objekt in Reichweite wird größer oder kleiner. Unwillige Kreaturen machen einen Konstitutions-Rettungswurf. Vergrößern: doppelte Größe, eine Größenkategorie größer, Vorteil auf Stärkeproben und -rettungswürfe, Waffen verursachen +1W4 Schaden. Verkleinern: halbe Größe, eine Kategorie kleiner, Nachteil auf Stärkeproben und -rettungswürfe, Waffen verursachen −1W4 Schaden (mindestens 1).",tip:"Mach euren stärksten Nahkämpfer riesig oder einen gefährlichen Gegner winzig."},
 feuerball:{s:"Hervorrufung",k:"V, G, M (ein Kügelchen aus Fledermausguano und Schwefel)",dur:"Sofort",t:"Ein Lichtstrahl schießt von deinem Finger zu einem Punkt in Reichweite und explodiert dort. Jede Kreatur in einer Kugel mit 20 ft Radius macht einen Geschicklichkeits-Rettungswurf und erleidet bei einem Fehlschlag 8W6 Feuerschaden, bei einem Erfolg die Hälfte. Das Feuer breitet sich um Ecken aus und entzündet brennbare Objekte, die niemand trägt.",h:"+1W6 pro Platzgrad über 3.",tip:"Mit Vorsichtigem Zauber schützt du Verbündete im Explosionsradius."},
 blitz:{s:"Hervorrufung",k:"V, G, M (etwas Fell und ein Stab aus Bernstein, Kristall oder Glas)",dur:"Sofort",t:"Ein Blitz bildet eine 100 ft lange und 5 ft breite Linie, die von dir ausgeht. Jede Kreatur auf der Linie macht einen Geschicklichkeits-Rettungswurf und erleidet bei einem Fehlschlag 8W6 Blitzschaden, bei einem Erfolg die Hälfte. Brennbare Objekte, die niemand trägt, fangen Feuer.",h:"+1W6 pro Platzgrad über 3.",tip:"Ideal in langen Gängen, wenn die Gegner hintereinanderstehen."},
 gegenz:{s:"Bannmagie",k:"G",dur:"Sofort",zeit:"1 Reaktion, wenn du siehst, wie eine Kreatur in 60 ft einen Zauber wirkt",t:"Du versuchst, den Zauber zu unterbrechen. Ist er von Grad 3 oder niedriger, schlägt er fehl und hat keine Wirkung. Ist er von Grad 4 oder höher, machst du eine Charisma-Probe gegen SG 10 + Grad des Zaubers. Bei einem Erfolg schlägt er fehl.",h:"Mit einem höheren Platz unterbrichst du Zauber bis zu diesem Grad automatisch.",tip:"Bewahre dir einen Platz für den gefährlichsten gegnerischen Zauber auf."},
 hast:{s:"Verwandlung",k:"V, G, M (ein Stück Süßholzwurzel)",dur:"Konzentration, bis zu 1 Minute",t:"Eine bereitwillige Kreatur in Reichweite wird beschleunigt: doppelte Bewegungsrate, +2 RK, Vorteil auf Geschicklichkeits-Rettungswürfe und in jedem Zug eine zusätzliche Aktion. Diese darf nur für einen Angriff (ein Waffenangriff), Spurt, Rückzug, Verstecken oder einen Gegenstand benutzen genutzt werden. Endet der Zauber, kann sich das Ziel bis zum Ende seines nächsten Zuges weder bewegen noch handeln.",tip:"Auf euren besten Nahkämpfer. Verlierst du die Konzentration, fällt er eine Runde aus!"},
 fliegen:{s:"Verwandlung",k:"V, G, M (eine Schwungfeder)",dur:"Konzentration, bis zu 10 Minuten",t:"Eine bereitwillige Kreatur, die du berührst, erhält eine Flugbewegungsrate von 60 ft. Endet der Zauber, während sie in der Luft ist, fällt sie, sofern sie den Sturz nicht anders aufhalten kann.",h:"+1 Ziel pro Platzgrad über 3.",tip:"Achte auf deine Konzentration, wenn ihr hoch über dem Boden seid."},
 muster:{s:"Illusion",k:"G, M (ein glühendes Räucherstäbchen oder eine Kristallphiole mit leuchtendem Material)",dur:"Konzentration, bis zu 1 Minute",t:"Ein schillerndes Farbmuster erscheint in einem 30-ft-Würfel in Reichweite. Jede Kreatur im Bereich, die das Muster sieht, macht einen Weisheits-Rettungswurf. Bei einem Fehlschlag ist sie bezaubert, handlungsunfähig und hat Bewegungsrate 0. Das endet, wenn sie Schaden erleidet oder jemand sie mit einer Aktion wachrüttelt.",tip:"Schaltet halbe Gegnergruppen aus. Danach sollte die Gruppe nicht auf die Bezauberten einschlagen, sondern erst die anderen erledigen."},
 verlang:{s:"Verwandlung",k:"V, G, M (ein Tropfen Melasse)",dur:"Konzentration, bis zu 1 Minute",t:"Bis zu sechs Kreaturen deiner Wahl in einem 40-ft-Würfel in Reichweite machen einen Weisheits-Rettungswurf. Bei einem Fehlschlag: halbe Bewegungsrate, −2 auf RK und Geschicklichkeits-Rettungswürfe, keine Reaktionen, pro Zug nur Aktion oder Bonusaktion und höchstens ein Angriff. Wirkt ein Betroffener einen Zauber, würfelt er einen W20: Bei 11 oder mehr wirkt der Zauber erst in seinem nächsten Zug. Am Ende jedes seiner Züge darf er erneut würfeln.",tip:"Stark gegen viele Gegner mit mehreren Angriffen."},
 wasser:{s:"Verwandlung",k:"V, G, M (ein kurzes Schilfrohr oder ein Strohhalm)",dur:"24 Stunden",t:"Bis zu zehn bereitwillige Kreaturen in Reichweite, die du sehen kannst, können für die Dauer unter Wasser atmen. Sie behalten ihre normale Atmung.",tip:"Merrow, Wracks, Unterwasserhöhlen: Auf einer Insel lohnt sich das."}
};
const CONDS=[["Bezaubert","Greift die Quelle nicht an; sie hat Vorteil bei sozialen Proben gegen dich."],["Blind","Siehst nichts; deine Angriffe Nachteil, Angriffe gegen dich Vorteil."],["Gelähmt","Handlungsunfähig, keine Bewegung; Angriffe gegen dich Vorteil, Nahkampftreffer sind kritisch; STR/GES-RW scheitern."],["Gepackt","Bewegungsrate 0."],["Handlungsunfähig","Keine Aktionen und keine Reaktionen."],["Festgesetzt","Bewegung 0; deine Angriffe Nachteil, Angriffe gegen dich Vorteil; Nachteil auf GES-RW."],["Liegend","Nahkampf gegen dich Vorteil, Fernkampf Nachteil; Aufstehen kostet halbe Bewegung."],["Unsichtbar","Deine Angriffe Vorteil, Angriffe gegen dich Nachteil."],["Verängstigt","Nachteil auf Proben und Angriffe, solange du die Quelle siehst; kannst dich ihr nicht nähern."],["Vergiftet","Nachteil auf Angriffe und Attributsproben."],["Bewusstlos","Handlungsunfähig, liegend, lässt alles fallen; Angriffe gegen dich Vorteil, Nahkampftreffer kritisch."],["Betäubt","Handlungsunfähig; STR/GES-RW scheitern; Angriffe gegen dich Vorteil."]];

/* ================= DRUCKBOGEN ================= */
function buildPrint(blank){
  const r=RACES[S.race]||{n:"–",speed:30,traits:[]}, b=BGS[S.bg]||{n:"–",s:[],f:"",e:"",l:0};
  const P=PB(), sc=k=>score(k)||10, ks=knownSkills();
  const dex=mod(sc("dex")),cha=mod(sc("cha")),wis=mod(sc("wis")),str=mod(sc("str"));
  const dc=8+P+cha, atk=P+cha, hpm=hpMax(), spMax=L()>=2?L():0;
  const dr=DRAGONS.find(d=>d[0]===S.dragon)||["____","____"];
  const v=x=>blank?"":esc(x==null?"":x);
  const lines=n=>Array.from({length:n},()=>'<div class="ln"></div>').join("");
  const abl=AB.map(([k,de,ab])=>{const val=sc(k),m=mod(val),sv=["con","cha"].includes(k);
    return `<div class="ab"><div class="sc"><div class="k">${ab}</div><div class="m">${sg(m)}</div><div class="v">${val}</div></div><div>
      <div class="r sv"><span class="pd ${sv?"on":""}"></span><span class="n">${sg(m+(sv?P:0))}</span>Rettungswurf</div>
      ${SKILLS.filter(s=>s[1]===k).map(([n])=>`<div class="r"><span class="pd ${ks.has(n)?"on":""}"></span><span class="n">${sg(m+(ks.has(n)?P:0))}</span>${n}</div>`).join("")}</div></div>`;}).join("");
  const weapon=S.equip.w==="stab"?["Kampfstab",sg(P+str),"1W6"+sg(str)+" Wucht"]:["Leichte Armbrust",sg(P+dex),"1W8"+sg(dex)+" Stich, 80/320 ft"];
  const atkRows=S.cantrips.filter(id=>/Zauberangriff|Rettungswurf/.test(SP[id][6])).map(id=>{const s=SP[id];const isSave=/Rettungswurf/.test(s[6])&&!/Zauberangriff/.test(s[6]);
     const dmg=(s[6].match(/(\d+W\d+[^,.]*?)(?=,|\.| und| das)/)||["",""])[1];return `<tr><td><b>${s[2]}</b></td><td>${isSave?"SG "+dc:sg(atk)}</td><td>${dmg} · ${s[5]}</td></tr>`;}).join("");
  const slots=(SLOTS[L()]||[]).map((n,g)=>`<div class="sl"><b>Grad ${g+1}</b>${Array.from({length:n},()=>'<span class="ci big"></span>').join("")}</div>`).join("");
  const spl=ids=>ids.map(id=>{const s=SP[id];return `<div class="spl"><div class="t"><span>${s[2]}</span><small>${s[1]?"G"+s[1]+" · ":""}${s[4]} · ${s[5]}${s[8]?" · K":""}</small></div><p>${s[6]}</p></div>`;}).join("");
  const spells=[...S.spells].sort((a,c)=>SP[a][1]-SP[c][1]);
  const meta=S.meta.map(id=>META.find(x=>x[0]===id)).filter(Boolean);
  const eq=[EQUIP[0][1].find(o=>o[0]===S.equip.w),EQUIP[1][1].find(o=>o[0]===S.equip.f),EQUIP[2][1].find(o=>o[0]===S.equip.p)].filter(Boolean).map(o=>o[1]);
  const langs=["Gemeinsprache","Drakonisch"].concat(r.lang||[]).concat(b.l?[`+${b.l} aus Hintergrund`]:[]);
  const hdr=(sub)=>`<div class="hd"><div><div class="nm">${esc(S.name)||"&nbsp;"}</div></div><div class="mt"><b>Zauberin ${L()}</b> · Drakonische Blutlinie (<b>${dr[0]}</b>, ${dr[1]})<br>${r.n} · ${b.n}${S.player?" · Spielerin: "+esc(S.player):""}${sub?"<br><b>"+sub+"</b>":""}</div></div>`;

  /* Seite 1: Spielen */
  let h=`<div class="pg">${hdr("")}<div class="g3">
   <div class="col">
    <div class="bx"><h3>Attribute <span>Übungsbonus +${P}</span></h3>${abl}</div>
    <div class="bx"><h3>Sinne &amp; Sprachen</h3><div class="ft">Passive Wahrnehmung <b>${10+wis+(ks.has("Wahrnehmung")?P:0)}</b>${/Dunkelsicht/.test(r.traits.join())?" · Dunkelsicht 60 ft":""}</div><div class="ft">${langs.join(", ")}</div><div class="ft" style="margin:0">Waffen: Dolch, Wurfpfeil, Schleuder, Kampfstab, leichte Armbrust</div></div>
   </div>
   <div class="col">
    <div class="bx"><h3>Kampf</h3>
     <div class="tiles"><div class="tl"><div class="b">${13+dex}</div><div class="l">RK</div></div><div class="tl"><div class="b">${sg(dex)}</div><div class="l">Initiative</div></div><div class="tl"><div class="b">${r.speed}</div><div class="l">Bewegung ft</div></div><div class="tl"><div class="b">+${P}</div><div class="l">Übung</div></div></div>
     <div class="hpbox"><span class="lbl">Aktuelle TP</span><span class="mx">Maximum <b>${hpm}</b></span><div class="val">${v(S.hp)}</div></div>
     <div class="sm2"><div class="smb"><span class="lbl">Temporäre TP</span><div class="val">${v(S.thp)}</div></div><div class="smb"><span class="lbl">Trefferwürfel (W6)</span><div class="val">${blank?"":esc(S.hd)} <span style="font-size:8pt;color:#5c554a">/ ${L()}</span></div></div></div>
     <div class="ds"><span>Todesrettung &nbsp;Erfolg <span class="ci"></span><span class="ci"></span><span class="ci"></span></span><span>Fehlschlag <span class="ci"></span><span class="ci"></span><span class="ci"></span></span></div>
    </div>
    <div class="bx"><h3>Angriffe</h3><table><tr><th>Angriff</th><th>Bonus</th><th>Schaden</th></tr>${atkRows}<tr><td><b>${weapon[0]}</b></td><td>${weapon[1]}</td><td>${weapon[2]}</td></tr><tr><td><b>Dolch</b></td><td>${sg(P+dex)}</td><td>1W4${sg(dex)} Stich, Wurf 20/60</td></tr><tr><td>&nbsp;</td><td></td><td></td></tr></table></div>
    <div class="bx"><h3>Gerade aktiv</h3><div class="wl"><b>Konzentration auf:</b><i></i></div><div class="wl"><b>Zustände:</b><i>${blank?"":esc(S.cond).split("\n")[0]}</i></div><div class="wl" style="align-items:center;gap:1mm"><b>Inspiration</b><span class="sq"></span></div><div class="wl" style="align-items:center;gap:1.5mm"><b>Erschöpfung</b><span style="flex:none;display:inline-block;width:8mm;height:5.5mm;border:1.2px solid #5c554a;border-radius:1mm"></span><span style="font-size:6.3pt;color:#5c554a">/ 6 (s. Anhang)</span></div></div>
    <div class="bx grow"><h3>Kampfnotizen <span>Initiative, Gegner …</span></h3><div class="lines">${lines(30)}</div></div>
   </div>
   <div class="col">
    <div class="bx"><h3>Zauberei <span>Attribut: Charisma</span></h3>
     <div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tl"><div class="b">${dc}</div><div class="l">Zauber-SG</div></div><div class="tl"><div class="b">${sg(atk)}</div><div class="l">Zauberangriff</div></div></div>
     <div style="margin-top:1.6mm;font-size:6.6pt;color:#5c554a;font-weight:700;text-transform:uppercase">Zauberplätze <span style="font-weight:400;text-transform:none">(abhaken, lange Rast füllt auf)</span></div>${slots}
     ${spMax?`<div class="sl"><b>Punkte</b>${Array.from({length:spMax},()=>'<span class="ci big"></span>').join("")}</div>
     <div style="font-size:6.8pt;color:#3f3a33;line-height:1.35">Quelle der Magie (Bonusaktion): Platz G1 = 2 Punkte · G2 = 3 · G3 = 5 (ab St. 5). Platz → Punkte: Punkte = Grad.</div>`:""}
    </div>
    <div class="bx"><h3>Zaubertricks <span>unbegrenzt</span></h3>${spl(S.cantrips)}</div>
    <div class="bx grow"><h3>Zauber <span>kostet Platz · Details im Anhang</span></h3>${spl(spells)}<div class="lines" style="margin-top:1mm">${lines(12)}</div></div>
   </div></div>
   <div class="bx turn" style="margin-top:2.5mm;font-size:7.4pt;line-height:1.35"><b>Dein Zug:</b> Bewegung bis ${r.speed} ft (aufteilbar) · <b>1 Aktion</b> (Zauber, Angriff, Spurt, Ausweichen, Rückzug, Helfen, Verstecken) · <b>1 Bonusaktion</b> (nur wenn etwas sie erlaubt, z. B. Nebelschritt, Beschleunigter Zauber) · <b>1 Reaktion</b> pro Runde (Schild, Gelegenheitsangriff). Wirkst du einen Zauber als Bonusaktion, darfst du im selben Zug nur noch einen Zaubertrick wirken. <b>K</b> = Konzentration: bei Schaden KON-Rettungswurf, SG 10 oder halber Schaden (der höhere Wert).</div>
  </div>`;

  /* Seite 2: Charakter, Merkmale, Ausrüstung */
  h+=`<div class="pg">${hdr("Charakter &amp; Ausrüstung")}<div class="g2" style="flex:1;min-height:0">
   <div class="col">
    <div class="bx"><h3>Merkmale der Zauberin</h3>
     <div class="ft"><b>Drachenahn: ${dr[0]} (${dr[1]})</b><p>Du sprichst, liest und schreibst Drakonisch. Bei Charisma-Proben im Umgang mit Drachen verdoppelt sich dein Übungsbonus.</p></div>
     <div class="ft"><b>Drakonische Widerstandskraft</b><p>+1 TP pro Stufe (schon eingerechnet). Ohne Rüstung ist deine RK 13 + GES. Feine Drachenschuppen zeigen sich auf deiner Haut.</p></div>
     ${L()>=2?`<div class="ft"><b>Quelle der Magie (${spMax} Zauberpunkte)</b><p>Bonusaktion: Zauberpunkte in einen Zauberplatz verwandeln (G1 = 2, G2 = 3, G3 = 5 Punkte) oder einen Platz in Punkte (Punkte = Grad). Erschaffene Plätze verschwinden bei einer langen Rast.</p></div>`:""}
     ${L()>=3?`<div class="ft"><b>Metamagie</b><p>Pro Zauber nur eine Metamagie, außer wo anders angegeben.</p></div>`+meta.map(m=>`<div class="ft"><b>${m[1]}</b> (${m[3]})<p>${m[4]}</p></div>`).join(""):""}
     <div class="ft"><b>Ab Stufe 6: Elementare Affinität</b><p>Zauber mit ${dr[1]}schaden: +CHA-Mod. auf einen Schadenswurf; für 1 Punkt 1 Stunde Resistenz gegen ${dr[1]}.</p></div>
    </div>
    <div class="bx"><h3>${r.n}</h3>${r.traits.map(t=>`<div class="ft" style="margin-bottom:.8mm">${t}</div>`).join("")}</div>
    <div class="bx"><h3>Hintergrund: ${b.n}</h3><div class="ft">${b.f}</div><div class="ft" style="margin:0">Geübt: ${b.s.join(", ")}</div></div>
    <div class="bx grow"><h3>Verbündete, Kontakte &amp; Ziele</h3><div class="lines">${lines(20)}</div></div>
   </div>
   <div class="col">
    <div class="bx"><h3>Persönlichkeit</h3>
     <div class="wl"><b>Charakterzüge</b><i></i></div><div class="wl"><b>Ideale</b><i></i></div><div class="wl"><b>Bindungen</b><i></i></div><div class="wl"><b>Makel</b><i></i></div>
     <div class="wl"><b>Aussehen</b><i>${esc(S.appearance).slice(0,70)}</i></div>
     ${S.story?`<div class="ft" style="margin-top:1.6mm">${esc(S.story).replace(/\n/g,"<br>")}</div>`:`<div class="wl"><b>Herkunft</b><i></i></div><div class="wl"><b></b><i></i></div>`}
    </div>
    <div class="bx"><h3>Ausrüstung</h3><div class="ft">${eq.concat(["2 Dolche"]).join(" · ")}</div><div class="ft">${b.e.replace(/, \d+ GM$/,"")}</div><div>${lines(7)}</div></div>
    <div class="bx"><h3>Münzen</h3><div class="coins">${["KM","SM","EM","GM","PM"].map(c=>`<div><span>${c}</span><i>${v(S.coins[c])}</i></div>`).join("")}</div></div>
    <div class="bx grow"><h3>Schätze, magische Gegenstände &amp; Notizen</h3><div class="lines">${lines(30)}</div></div>
   </div></div></div>`;

  /* Seite 3: Notizen */
  if(S.pNotes!==false) h+=`<div class="pg">${hdr("Abenteuer-Notizen")}<div class="bx grow" style="flex:1"><h3>Notizen <span>Orte, Namen, Hinweise, offene Fragen</span></h3><div class="lines">${lines(60)}</div></div></div>`;

  /* Anhang */
  if(S.pApp!==false){
    const card=id=>{const s=SP[id],x=LONG[id]||{};return `<div class="ac"><h4>${s[2]} <small>${s[3]}</small></h4><div class="gr">${s[1]?"Grad "+s[1]:"Zaubertrick"} · ${x.s||""}</div>
     <dl><dt>Zeitaufwand</dt><dd>${x.zeit||"1 "+s[4]}</dd><dt>Reichweite</dt><dd>${s[5]}</dd><dt>Komponenten</dt><dd>${x.k||""}</dd><dt>Dauer</dt><dd>${x.dur||""}</dd></dl>
     <p>${x.t||s[6]}</p>${x.h?`<div class="hi"><b>${s[1]?"Höhere Grade":"Höhere Stufen"}:</b> ${x.h}</div>`:""}${x.tip?`<div class="tp"><b>Tipp:</b> ${x.tip}</div>`:""}</div>`;};
    h+=`<div class="pg flow">${hdr("Anhang: Zauber im Detail")}<div class="ap">
     <h2 class="sec">Zaubertricks</h2>${S.cantrips.map(card).join("")}
     <h2 class="sec">Zauber</h2>${spells.map(card).join("")}
     <h2 class="sec">Zustände &amp; Komponenten</h2><div class="ac"><p style="font-size:7.6pt;margin:0 0 .8mm"><b>Erschöpfung</b> (Stufen summieren sich): 1 Nachteil auf Attributsproben · 2 Bewegungsrate halbiert · 3 Nachteil auf Angriffe und Rettungswürfe · 4 TP-Maximum halbiert · 5 Bewegungsrate 0 · 6 Tod. Eine lange Rast mit Essen und Trinken senkt sie um 1.</p>${CONDS.map(([n,t])=>`<p style="font-size:7.6pt;margin:0 0 .8mm"><b>${n}:</b> ${t}</p>`).join("")}</div>
     <div class="ac"><h4>Komponenten</h4><p style="font-size:7.6pt"><b>V</b> = verbal (sprechen), <b>G</b> = Gesten (eine Hand frei), <b>M</b> = Material. Material ohne Preis ersetzt dein arkaner Fokus oder Komponentenbeutel. Mit <i>Unauffälligem Zauber</i> entfallen V und G.</p></div>
    </div></div>`;
  }
  let el=document.getElementById("print"); if(!el){el=document.createElement("div");el.id="print";document.body.appendChild(el);}
  el.innerHTML=h;
}
function doPrint(blank){buildPrint(blank);setTimeout(()=>window.print(),60);}

function dl(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download=(S.name||"zauberin")+"-stand.json";a.click();}
function ul(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(S,JSON.parse(t));save();render();}catch(e){alert("Datei konnte nicht gelesen werden.");}});}
render();
