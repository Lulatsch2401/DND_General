<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zauberin erstellen – Guide (Drakonische Blutlinie)</title>
<style>
:root{
  --bg:#f4f1ec;--s1:#fff;--s2:#faf8f4;--bd:#ddd6c9;--bd2:#b9ad98;
  --tx:#231f1a;--tx2:#5c554a;--tx3:#8c8475;
  --ac:#8a4b1f;--ac-ink:#5e3214;--ac-soft:#f5e9df;
  --pu:#6b4fa0;--pu-soft:#eee9f6;--ok:#2f6f4f;--ok-soft:#e5f1ea;--bad:#a13a2f;
  --r:10px;--sh:0 1px 2px rgba(30,28,20,.06),0 1px 8px rgba(30,28,20,.05);color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:20px 16px 80px}
input,select,textarea,button{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto}
header.top{background:linear-gradient(135deg,#8a4b1f,#b0652a 55%,#6b4fa0);color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:14px;box-shadow:var(--sh)}
header.top h1{margin:0 0 4px;font-size:24px}
header.top p{margin:0;font-size:13.5px;opacity:.92;line-height:1.5}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.steps button{border:1px solid var(--bd);background:var(--s1);color:var(--tx2);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.steps button .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--s2);border:1px solid var(--bd2);align-items:center;justify-content:center;font-size:11px;font-weight:700}
.steps button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps button.active{border-color:var(--ac);color:var(--ac-ink);font-weight:700;background:var(--ac-soft)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:19px;color:var(--ac-ink)}
.lead{margin:0 0 14px;color:var(--tx2);font-size:14px;line-height:1.55}
.tip{background:var(--pu-soft);border:1px solid #d8cfec;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.5;margin:0 0 14px;color:#3d2f5c}
.tip b{color:#2d2147}
.status{font-size:13px;font-weight:700;margin:0 0 10px}
.status.ok{color:var(--ok)}.status.no{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.opt{border:1.5px solid var(--bd);border-radius:var(--r);padding:11px 12px;background:var(--s2);cursor:pointer;position:relative;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--bd2)}
.opt.sel{border-color:var(--ac);background:var(--ac-soft)}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.opt .t small{display:block;font-weight:400;color:var(--tx3);font-size:11px}
.opt .t{flex-direction:column;align-items:flex-start;gap:0}
.opt .m{font-size:11px;color:var(--pu);font-weight:700;margin:2px 0 4px}
.opt .d{font-size:12.5px;color:var(--tx2);line-height:1.5}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--ok-soft);color:var(--ok);margin-left:4px;vertical-align:middle}
.badge.warn{background:#fbeaea;color:var(--bad)}
.opt .check{position:absolute;top:8px;right:9px;width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2);background:#fff}
.opt.sel .check{background:var(--ac);border-color:var(--ac)}
.opt.sel .check::after{content:"✓";color:#fff;font-size:11px;position:absolute;left:3px;top:-1px;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--ac);background:var(--ac);color:#fff;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--ac-ink)}
.btn.sec{background:var(--s1);color:var(--ac-ink)}
.btn.sec:hover{background:var(--ac-soft)}
.btn.pu{border-color:var(--pu);background:var(--s1);color:var(--pu)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2)}
.field input,.field select,.field textarea{border:1px solid var(--bd2);border-radius:7px;padding:7px 9px;font-size:14px;background:#fff}
.field textarea{min-height:80px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
table.ab{width:100%;border-collapse:collapse;font-size:13.5px}
table.ab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);border-bottom:1px solid var(--bd);padding:6px}
table.ab td{border-bottom:1px solid var(--bd);padding:6px;vertical-align:middle}
table.ab select{border:1px solid var(--bd2);border-radius:6px;padding:5px;font-size:14px}
.big{font-size:20px;font-weight:700}
.mod{display:inline-block;min-width:38px;text-align:center;background:var(--ac-soft);color:var(--ac-ink);border-radius:6px;padding:2px 6px;font-weight:700}

/* ---------- Ergebnis-Bogen ---------- */
.sheet .banner{background:linear-gradient(135deg,#8a4b1f,#b0652a 55%,#6b4fa0);color:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:12px}
.sheet .banner h1{margin:0;font-size:26px}
.sheet .banner .meta{font-size:13px;opacity:.92;margin-top:4px}
.scols{display:grid;grid-template-columns:250px 1fr 290px;gap:12px;align-items:start}
@media(max-width:980px){.scols{grid-template-columns:1fr}}
.scols>div{min-width:0}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:12px}
.sc h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac-ink);margin:0 0 8px;padding-left:8px;border-left:3px solid var(--ac)}
.abl{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin-bottom:6px;background:var(--s2)}
.abl .h{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.abl .h .sv{font-size:18px;color:var(--tx)}
.ln{display:flex;gap:6px;font-size:12px;padding:1px 0;align-items:center}
.ln .v{width:26px;text-align:right;font-weight:700}
.ln .p{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bd2);flex:none}
.ln .p.on{background:var(--ac);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
.st{border:1px solid var(--bd);border-radius:8px;text-align:center;padding:6px 3px;background:var(--s2)}
.st .b{font-size:20px;font-weight:700}
.st .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2)}
.st input{width:70%;font-size:18px;font-weight:700;text-align:center;border:1px solid var(--bd2);border-radius:6px}
.dots{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
input.dot{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid var(--bd2);border-radius:50%;margin:0;background:#fff;cursor:pointer}
input.dot:checked{background:var(--ac);border-color:var(--ac)}
input.dot.fail:checked{background:var(--bad);border-color:var(--bad)}
.sp{border:1px solid var(--bd);border-radius:7px;padding:6px 8px;margin-bottom:5px;background:var(--s2);break-inside:avoid}
.sp .t{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:700}
.sp .t small{font-weight:700;color:var(--pu);font-size:10px;white-space:nowrap}
.sp p{margin:2px 0 0;font-size:11.5px;color:var(--tx2);line-height:1.4}
.sheet table{width:100%;border-collapse:collapse;font-size:12px}
.sheet th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--tx2);border-bottom:1px solid var(--bd);padding:3px}
.sheet td{border-bottom:1px solid var(--bd);padding:4px 3px;vertical-align:top}
.ft{margin-bottom:6px;font-size:12px;line-height:1.4;break-inside:avoid}
.ft b{font-size:12.5px}
.ft p{margin:1px 0 0;color:var(--tx2)}
.vol{border:1px solid var(--bd2);border-radius:6px;padding:4px 6px;font-size:13px;width:100%;background:#fff}
.sheet-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ptext{display:none}

@page{size:A4;margin:9mm}
#print{display:none}
@media print{
  html,body{background:#fff !important;padding:0 !important;margin:0}
  body>*:not(#print){display:none !important}
  #print{display:block;color:#1d1a16;font-size:8.6pt;line-height:1.3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#print .pg{height:278mm;display:flex;flex-direction:column;overflow:hidden;break-after:page;page-break-after:always}
#print .pg.flow{height:auto;display:block;overflow:visible}
#print .pg:last-child{break-after:auto;page-break-after:auto}
#print .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #8a4b1f;padding-bottom:2mm;margin-bottom:2.5mm}
#print .hd h1{margin:0;font-size:19pt;line-height:1;color:#5e3214}
#print .hd .nm{min-width:70mm;border-bottom:1px solid #8c8475;font-size:19pt;font-weight:700;color:#5e3214;line-height:1.1}
#print .hd .mt{font-size:8pt;color:#5c554a;text-align:right;line-height:1.45}
#print .hd .mt b{color:#1d1a16}
#print .g3{display:grid;grid-template-columns:57mm 63mm 1fr;gap:3mm;flex:1;min-height:0}
#print .g2{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
#print .col{display:flex;flex-direction:column;gap:2.5mm;min-height:0}
#print .bx{border:1px solid #b9ad98;border-radius:2mm;padding:1.8mm 2.2mm;break-inside:avoid}
#print .bx.grow{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#print h3{margin:0 0 1.3mm;font-size:7.4pt;text-transform:uppercase;letter-spacing:.07em;color:#8a4b1f;display:flex;justify-content:space-between}
#print h3 span{color:#8c8475;font-weight:400;letter-spacing:0;text-transform:none}
#print .ab{display:grid;grid-template-columns:12mm 1fr;gap:1.6mm;padding:1.1mm 0;border-bottom:1px dotted #cfc6b6}
#print .ab:last-child{border-bottom:0}
#print .sc{border:1.3px solid #8a4b1f;border-radius:2mm;text-align:center;padding:.6mm 0;height:fit-content}
#print .sc .m{font-size:13pt;font-weight:700;line-height:1.05}
#print .sc .v{font-size:7pt;color:#5c554a;border-top:1px solid #ddd6c9}
#print .sc .k{font-size:6.3pt;font-weight:700;color:#8a4b1f;letter-spacing:.05em}
#print .r{display:flex;gap:1.3mm;align-items:center;font-size:7.8pt;line-height:1.38}
#print .r .n{width:5.5mm;text-align:right;font-weight:700}
#print .pd{width:2.3mm;height:2.3mm;border-radius:50%;border:1px solid #8c8475;flex:none}
#print .pd.on{background:#8a4b1f;border-color:#8a4b1f}
#print .r.sv{font-weight:700;color:#5e3214}
#print .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6mm}
#print .tl{border:1px solid #b9ad98;border-radius:1.5mm;text-align:center;padding:1mm 0 .6mm}
#print .tl .b{font-size:13pt;font-weight:700;line-height:1.1}
#print .tl .l{font-size:6.2pt;text-transform:uppercase;letter-spacing:.05em;color:#5c554a}
#print .hpbox{border:1.5px solid #8a4b1f;border-radius:2mm;height:19mm;position:relative;margin-top:1.8mm}
#print .hpbox .lbl{position:absolute;left:2mm;top:1mm;font-size:6.5pt;font-weight:700;color:#8a4b1f;text-transform:uppercase;letter-spacing:.05em}
#print .hpbox .mx{position:absolute;right:2mm;top:1mm;font-size:7pt;color:#5c554a}
#print .hpbox .val{position:absolute;left:0;right:0;top:5mm;text-align:center;font-size:20pt;font-weight:700}
#print .sm2{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm;margin-top:1.6mm}
#print .smb{border:1px solid #b9ad98;border-radius:1.5mm;height:11mm;position:relative}
#print .smb .lbl{position:absolute;left:1.6mm;top:.6mm;font-size:6.2pt;font-weight:700;color:#5c554a;text-transform:uppercase}
#print .smb .val{position:absolute;left:0;right:0;bottom:.8mm;text-align:center;font-size:12pt;font-weight:700}
#print .ci{display:inline-block;width:3.6mm;height:3.6mm;border:1.2px solid #5c554a;border-radius:50%;margin-right:1mm;vertical-align:middle}
#print .ci.big{width:4.6mm;height:4.6mm}
#print .sq{flex:none;display:inline-block;width:3mm;height:3mm;border:1.2px solid #5c554a;margin-right:.4mm;vertical-align:middle}
#print .ds{display:flex;justify-content:space-between;font-size:7pt;margin-top:1.6mm;color:#5c554a}
#print table{width:100%;border-collapse:collapse;font-size:7.6pt}
#print th{text-align:left;font-size:6.2pt;text-transform:uppercase;color:#5c554a;border-bottom:1px solid #b9ad98;padding:.4mm .6mm}
#print td{border-bottom:1px dotted #cfc6b6;padding:.8mm .6mm;vertical-align:top}
#print .ln{border-bottom:1px solid #cfc6b6;height:6.2mm;flex:none}
#print .lines{flex:1;overflow:hidden;min-height:0}
#print .wl{display:flex;gap:1.5mm;align-items:flex-end;font-size:7.5pt;margin-top:1.4mm}
#print .wl b{white-space:nowrap}
#print .wl i{flex:1;border-bottom:1px solid #8c8475;height:4mm;font-style:normal;font-size:8pt}
#print .sl{display:flex;align-items:center;gap:1.5mm;margin:.9mm 0;font-size:7.6pt}
#print .sl b{width:12mm;color:#5e3214}
#print .spl{padding:1mm 0;border-bottom:1px dotted #cfc6b6;break-inside:avoid}
#print .spl:last-child{border-bottom:0}
#print .spl .t{display:flex;justify-content:space-between;gap:1mm;font-weight:700;font-size:8pt}
#print .spl .t small{font-weight:600;color:#6b4fa0;font-size:6.6pt;white-space:nowrap}
#print .spl p{margin:.3mm 0 0;font-size:7.1pt;color:#3f3a33;line-height:1.3}
#print .ft{margin-bottom:1.6mm;font-size:7.6pt;line-height:1.33;break-inside:avoid}
#print .ft b{font-size:8pt;color:#1d1a16}
#print .ft p{margin:.2mm 0 0;color:#3f3a33}
#print .turn{background:#eee9f6;border-color:#cbbfe3}
#print .coins{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4mm}
#print .coins div{border:1px solid #b9ad98;border-radius:1.5mm;height:10mm;position:relative;text-align:center}
#print .coins span{position:absolute;left:0;right:0;top:.4mm;font-size:6.2pt;font-weight:700;color:#5c554a}
#print .coins i{position:absolute;left:0;right:0;bottom:.6mm;font-style:normal;font-size:10pt;font-weight:700}
#print .chk{display:grid;grid-template-columns:1fr 1fr;gap:.6mm 2mm;font-size:7.3pt}
#print .ap{column-count:2;column-gap:5mm}
#print .ac{break-inside:avoid;page-break-inside:avoid;display:inline-block;width:100%;box-sizing:border-box;border:1px solid #b9ad98;border-radius:2mm;padding:2mm 2.4mm;margin:0 0 2.6mm}
#print .ac h4{margin:0;font-size:10pt;color:#5e3214;display:flex;justify-content:space-between;align-items:baseline;gap:2mm}
#print .ac h4 small{font-size:7pt;color:#8c8475;font-weight:400}
#print .ac .gr{font-size:7pt;color:#6b4fa0;font-weight:700;margin:.3mm 0 1.2mm}
#print .ac dl{display:grid;grid-template-columns:auto 1fr;gap:.2mm 2mm;margin:0 0 1.4mm;font-size:7.4pt}
#print .ac dt{font-weight:700;color:#5c554a}
#print .ac dd{margin:0}
#print .ac p{margin:0 0 1mm;font-size:8pt;line-height:1.38}
#print .ac .hi{font-size:7.6pt;background:#f5e9df;border-radius:1.2mm;padding:.8mm 1.4mm;margin-top:1mm}
#print .ac .tp{font-size:7.4pt;color:#2f6f4f;margin-top:1mm}
#print h2.sec{font-size:11pt;color:#5e3214;margin:0 0 2mm;border-bottom:1.5px solid #8a4b1f;padding-bottom:1mm;display:inline-block;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <h1>Deine Zauberin erstellen</h1>
    <p>Schritt für Schritt zur Zauberin mit <b>Drakonischer Blutlinie</b> (D&amp;D 5e, Regeln von 2014). Du triffst jede Wahl selbst, die Erklärungen und <span style="background:#e5f1ea;color:#2f6f4f;border-radius:20px;padding:0 6px;font-weight:700;font-size:11px">Einsteigertipps</span> helfen dir dabei. Dein Stand wird in diesem Browser gespeichert.</p>
  </header>
  <div class="steps noprint" id="steps"></div>
  <div class="wizard" id="wizard"></div>
  <div id="sheetHost"></div>
</div>

<script>
/* ================= DATEN ================= */
const AB=[["str","Stärke","STR"],["dex","Geschicklichkeit","GES"],["con","Konstitution","KON"],["int","Intelligenz","INT"],["wis","Weisheit","WEI"],["cha","Charisma","CHA"]];
const ABN=Object.fromEntries(AB.map(a=>[a[0],a[2]]));
const SKILLS=[["Akrobatik","dex"],["Arkane Kunde","int"],["Athletik","str"],["Auftreten","cha"],["Einschüchtern","cha"],["Fingerfertigkeit","dex"],["Geschichte","int"],["Heilkunde","wis"],["Heimlichkeit","dex"],["Mit Tieren umgehen","wis"],["Motiv erkennen","wis"],["Nachforschungen","int"],["Naturkunde","int"],["Religion","int"],["Täuschen","cha"],["Überlebenskunst","wis"],["Überzeugen","cha"],["Wahrnehmung","wis"]];
const CLASS_SKILLS=["Arkane Kunde","Täuschen","Motiv erkennen","Einschüchtern","Überzeugen","Religion"];
const SKILL_INFO={"Arkane Kunde":"Wissen über Magie, Zauber und magische Wesen","Täuschen":"Lügen, verkleiden, bluffen","Motiv erkennen":"Merken, ob jemand lügt oder was er will","Einschüchtern":"Drohen und Druck machen","Überzeugen":"Freundlich überreden, verhandeln","Religion":"Wissen über Götter, Kulte und Rituale"};

const RACES={
 mensch:{n:"Mensch",lang:["+1 Sprache nach Wahl"],speed:30,b:{str:1,dex:1,con:1,int:1,wis:1,cha:1},tip:true,d:"+1 auf alle Attribute. Einfach und solide.",traits:["Vielseitig: +1 auf alle sechs Attribute.","Eine zusätzliche Sprache nach Wahl."]},
 halbelf:{n:"Halbelf",lang:["Elfisch","+1 Sprache nach Wahl"],speed:30,b:{cha:2},choose:2,extraSkills:2,tip:true,d:"+2 CHA und +1 auf zwei weitere Attribute, zwei Bonus-Fertigkeiten. Sehr gut für Zauberinnen.",traits:["Dunkelsicht 60 ft.","Feenblut: Vorteil gegen Bezauberung, kann nicht magisch eingeschläfert werden.","Vielseitigkeit: zwei zusätzliche Fertigkeiten nach Wahl."]},
 tiefling:{n:"Tiefling",lang:["Infernalisch"],speed:30,b:{cha:2,int:1},d:"+2 CHA, +1 INT. Feuerresistenz und eigene kleine Zauber.",traits:["Dunkelsicht 60 ft.","Resistenz gegen Feuerschaden.","Höllisches Erbe: Zaubertrick Thaumaturgie; ab Stufe 3 einmal pro langer Rast Höllischer Tadel (als Zauber 2. Grades)."]},
 drachen:{n:"Drachenblütige",lang:[],speed:30,b:{str:2,cha:1},d:"+2 STR, +1 CHA. Odemwaffe und Resistenz, passend zum Drachenahn.",traits:["Odemwaffe (Art wie dein Drachenahn): 2W6 Schaden, einmal pro kurzer oder langer Rast.","Resistenz gegen den Schadenstyp deines Ahnen.","Hinweis: STR ist für Zauberinnen wenig nützlich."]},
 hochelf:{n:"Hochelf",lang:["Elfisch","+1 Sprache nach Wahl"],speed:30,b:{dex:2,int:1},skills:["Wahrnehmung"],d:"+2 GES, +1 INT. Wahrnehmung geübt, ein zusätzlicher Magier-Zaubertrick.",traits:["Dunkelsicht 60 ft.","Feenblut: Vorteil gegen Bezauberung, kann nicht magisch eingeschläfert werden.","Trance: 4 Stunden meditieren statt 8 Stunden schlafen.","Wahrnehmung geübt.","Ein Zaubertrick aus der Magier-Liste (INT)."]},

let S={step:0,name:"",player:"",level:3,race:"",halfelf:[],bg:"",scores:{},dragon:"",skills:[],extraSkills:[],cantrips:[],spells:[],meta:[],equip:{w:"",f:"",p:""},story:"",appearance:"",hp:"",thp:"",hd:"",slotsUsed:{},spUsed:0,ds:{},coins:{},cond:"",boni:"frei",fb:{two:"cha",one:"con",one2:"dex"}};

/* ================= BERECHNUNG ================= */
const L=()=>parseInt(S.level)||3;
const PB=()=>2+Math.floor((L()-1)/4);
const mod=v=>Math.floor((v-10)/2);
const sg=n=>(n>=0?"+":"")+n;
const FREE=()=>S.boni!=="phb"&&S.race&&S.race!=="mensch";
function raceBonus(k){const r=RACES[S.race];if(!r)return 0;
  if(FREE()){let b=0;if(S.fb.two===k)b+=2;if(S.fb.one===k)b+=1;if(r.choose&&S.fb.one2===k)b+=1;return b;}
  let b=r.b[k]||0;if(r.choose&&S.halfelf.includes(k))b+=1;return b;}
function freeOk(){if(!FREE())return true;const a=[S.fb.two,S.fb.one];if(RACES[S.race].choose)a.push(S.fb.one2);return a.every(Boolean)&&new Set(a).size===a.length;}
function base(k){return parseInt(S.scores[k])||0;}
function score(k){return base(k)?base(k)+raceBonus(k):0;}
function knownSkills(){const set=new Set(S.skills);const bg=BGS[S.bg];if(bg)bg.s.forEach(x=>set.add(x));const r=RACES[S.race];if(r&&r.skills)r.skills.forEach(x=>set.add(x));S.extraSkills.forEach(x=>set.add(x));return set;}
function hpMax(){const c=mod(score("con")||10);const r=RACES[S.race];return 6+c+(L()-1)*(4+c)+L()+(r&&r.hp?L():0);}

/* ================= SCHRITTE ================= */
const STEPS=[
 {n:"Start",ok:()=>!!S.name},
 {n:"Volk",ok:()=>!!S.race&&(S.boni!=="phb"||!RACES[S.race].choose||S.halfelf.length===2)},
 {n:"Hintergrund",ok:()=>!!S.bg},
 {n:"Attribute",ok:()=>AB.every(([k])=>base(k))&&new Set(AB.map(([k])=>base(k))).size===6&&freeOk()},
 {n:"Drachenahn",ok:()=>!!S.dragon},
 {n:"Fertigkeiten",ok:()=>S.skills.length===2&&(!RACES[S.race]||!RACES[S.race].extraSkills||S.extraSkills.length===2)},
 {n:"Zaubertricks",ok:()=>S.cantrips.length===CANTRIPS_KNOWN[L()]},
 {n:"Zauber",ok:()=>S.spells.length===SPELLS_KNOWN[L()]},
 {n:"Metamagie",ok:()=>L()<3||S.meta.length===2},
 {n:"Ausrüstung",ok:()=>S.equip.w&&S.equip.f&&S.equip.p},

function renderSteps(){
  document.getElementById("steps").innerHTML=STEPS.map((s,i)=>`<button class="${i===S.step?"active":""} ${s.ok()&&i<11?"done":""}" onclick="go(${i})"><span class="n">${i+1}</span>${s.n}</button>`).join("");
}
function go(i){S.step=i;save();render();window.scrollTo({top:0,behavior:"smooth"});}
function nav(){
  const i=S.step;
  return `<div class="nav">${i>0?`<button class="btn sec" onclick="go(${i-1})">← Zurück</button>`:"<span></span>"}${i<STEPS.length-1?`<button class="btn" onclick="go(${i+1})">Weiter →</button>`:""}</div>`;
}
function status(okText,missing){const ok=STEPS[S.step].ok();return `<p class="status ${ok?"ok":"no"}">${ok?"✓ "+okText:missing}</p>`;}
function opt(sel,dis,title,meta,desc,on,extra=""){return `<div class="opt ${sel?"sel":""} ${dis?"dis":""}" ${dis?"":`onclick="${on}"`}><span class="check"></span><div class="t" style="padding-right:22px">${title}</div>${meta?`<div class="m">${meta}</div>`:""}<div class="d">${desc}</div>${extra}</div>`;}
const TIP=`<span class="badge">Einsteigertipp</span>`;

  const w=document.getElementById("wizard"), sh=document.getElementById("sheetHost");
  sh.innerHTML=""; w.style.display="";
  const i=S.step;
  let h="";
  if(i===0){
    h=`<div class="card"><h2>Willkommen!</h2><p class="lead">Eine <b>Zauberin</b> (Sorcerer) trägt Magie im Blut. Deine stammt von einem <b>Drachen</b> in deiner Ahnenreihe. Du brauchst kein Zauberbuch, deine Zauber kommen aus dir selbst. Dein wichtigstes Attribut ist <b>Charisma</b>.</p>
    <div class="tip"><b>So funktioniert der Guide:</b> Geh die Schritte oben der Reihe nach durch. Ein grüner Haken zeigt, dass ein Schritt vollständig ist. Du kannst jederzeit zurückspringen und etwas ändern. Am Ende steht dein fertiger Charakterbogen zum Drucken.</div>
    <div class="two"><div class="field"><label>Name deiner Zauberin</label><input value="${esc(S.name)}" oninput="S.name=this.value;save();renderSteps()" placeholder="z. B. Ilyra"></div>

    <div class="grid">${Object.entries(RACES).map(([k,v])=>opt(S.race===k,false,v.n+(v.tip?TIP:""),Object.entries(v.b).map(([a,n])=>ABN[a]+" +"+n).join(", ")+(v.choose?", +1 auf zwei weitere":"")+" · "+v.speed+" ft",v.d,`S.race='${k}';S.halfelf=[];S.extraSkills=[];save();render()`)).join("")}</div>
    ${r&&r.choose&&S.boni==="phb"?`<h2 style="margin-top:16px;font-size:16px">Halbelf: Wähle zwei Attribute für je +1</h2><p class="lead">Nicht Charisma (das bekommt schon +2). Empfehlung: Konstitution und Geschicklichkeit.</p>
      <div class="grid">${AB.filter(([k])=>k!=="cha").map(([k,de])=>opt(S.halfelf.includes(k),!S.halfelf.includes(k)&&S.halfelf.length>=2,de+" +1","","",`toggle('halfelf','${k}',2)`)).join("")}</div>`:""}
    ${r?`<div class="tip" style="margin-top:14px"><b>${r.n} – Merkmale:</b><br>${r.traits.join("<br>")}</div>`:""}
    ${nav()}</div>`;
  }
  if(i===2){
    const b=BGS[S.bg];
    h=`<div class="card"><h2>Schritt 3: Dein Hintergrund</h2><p class="lead">Was hast du gemacht, bevor du Abenteuerin wurdest? Der Hintergrund gibt dir zwei Fertigkeiten, eine Fähigkeit und etwas Ausrüstung. Wähle, was zu deiner Geschichte passt.</p>
    ${status("Hintergrund gewählt","Wähle einen Hintergrund.")}
    <div class="grid">${Object.entries(BGS).map(([k,v])=>opt(S.bg===k,false,v.n,v.s.join(", ")+(v.l?` · ${v.l} Sprache${v.l>1?"n":""}`:""),v.d,`S.bg='${k}';S.skills=S.skills.filter(x=>!BGS['${k}'].s.includes(x));save();render()`)).join("")}</div>
    ${b?`<div class="tip" style="margin-top:14px"><b>${b.n}:</b> ${b.f}<br><b>Ausrüstung:</b> ${b.e}</div>`:""}
    ${nav()}</div>`;
  }
  if(i===3){
    const used=AB.map(([k])=>base(k)).filter(Boolean);
    h=`<div class="card"><h2>Schritt 4: Deine Attribute</h2><p class="lead">Verteile die sechs Werte <b>15, 14, 13, 12, 10, 8</b> auf deine Attribute, jeden genau einmal. Die Volksboni kommen automatisch dazu. Der <b>Modifikator</b> ist die Zahl, die du später zu deinen Würfen addierst.</p>
    <h2 style="font-size:15px;margin:4px 0 8px">Wie kommen die Volksboni dazu?</h2>
    <div class="grid" style="margin-bottom:12px">
     ${opt(S.boni!=="phb",false,"Volksboni frei verteilen"+TIP,"Wie bei Elara · Tashas Eigene Herkunft","Den +2-Bonus und den +1-Bonus deines Volkes legst du auf beliebige Attribute. So erreicht jedes Volk 17 Charisma.","S.boni='frei';save();render()")}
     ${opt(S.boni==="phb",false,"PHB-Volksboni","Nach dem Spielerhandbuch","Die Boni sind fest an dein Volk gebunden (siehe Schritt 2).","S.boni='phb';save();render()")}
    </div>
    ${FREE()?`<div class="two" style="grid-template-columns:repeat(${RACES[S.race].choose?3:2},1fr);margin-bottom:12px">
      ${[["two","+2 auf"],["one","+1 auf"]].concat(RACES[S.race].choose?[["one2","weiteres +1 auf (Halbelf)"]]:[]).map(([f,l])=>`<div class="field"><label>${l}</label><select onchange="S.fb.${f}=this.value;save();render()"><option value="">–</option>${AB.map(([k,de])=>`<option value="${k}" ${S.fb[f]===k?"selected":""}>${de}</option>`).join("")}</select></div>`).join("")}
     </div>${freeOk()?"":`<p class="status no">Jeder Bonus muss auf ein anderes Attribut.</p>`}`:(S.race==="mensch"&&S.boni!=="phb"?`<div class="tip">Menschen bekommen +1 auf alle Attribute, da gibt es nichts zu verteilen.</div>`:"")}
    <div class="tip">${TIP} Für Zauberinnen: <b>Charisma</b> am höchsten (deine Zauber), dann <b>Konstitution</b> (Trefferpunkte, Konzentration halten), dann <b>Geschicklichkeit</b> (Rüstungsklasse, Initiative). <button class="btn pu" style="margin-left:6px;padding:4px 10px;font-size:12px" onclick="recommend()">Empfehlung übernehmen</button><br><span style="font-size:12px">${S.boni!=="phb"&&S.race!=="mensch"?"Setzt CHA 15 + 2 = <b>17</b> und KON 14 + 1 = <b>15</b>"+(RACES[S.race]&&RACES[S.race].choose?", GES 13 + 1 = 14":"")+". Elara hat es genauso gemacht, nur mit WEI statt CHA.":"Setzt die Standardreihe passend für eine Zauberin."}</span></div>
    ${status("Alle Werte verteilt","Jeder Wert muss genau einmal vergeben werden.")}
    <table class="ab"><tr><th>Attribut</th><th>Wert</th><th>Volksbonus</th><th>Ergebnis</th><th>Modifikator</th><th>Wofür?</th></tr>
    ${AB.map(([k,de,ab])=>{const v=base(k);const opts=ARRAY.map(n=>`<option value="${n}" ${v===n?"selected":""} ${used.includes(n)&&v!==n?"disabled":""}>${n}</option>`).join("");
      const tot=score(k);
      const why={str:"Tragen, klettern, schwere Waffen",dex:"Rüstungsklasse, Initiative, Armbrust",con:"Trefferpunkte, Konzentration",int:"Wissen, Arkane Kunde",wis:"Wahrnehmung, Motiv erkennen",cha:"<b>Deine Zauber</b>, Reden, Verhandeln"}[k];
      return `<tr><td><b>${ab}</b> ${de}</td><td><select onchange="S.scores['${k}']=parseInt(this.value)||0;save();render()"><option value="">–</option>${opts}</select></td><td>${raceBonus(k)?"+"+raceBonus(k):"–"}</td><td class="big">${tot||"–"}</td><td>${tot?`<span class="mod">${sg(mod(tot))}</span>`:""}</td><td style="font-size:12.5px;color:var(--tx2)">${why}</td></tr>`;}).join("")}
    </table>${nav()}</div>`;
  }
  if(i===4){
    h=`<div class="card"><h2>Schritt 5: Dein Drachenahn</h2><p class="lead">Welcher Drache war deine Ahnin oder dein Ahn? Das bestimmt die <b>Schadensart</b>, die später (ab Stufe 6) stärker wird, und ist wichtig für deine Geschichte. Du sprichst außerdem <b>Drakonisch</b>, und bei Charisma-Proben mit Drachen zählt dein Übungsbonus doppelt.</p>
    <div class="tip">Auf Stormwreck Isle leben und lagen viele Drachen. Deine Farbe kann eine Verbindung zu ihnen schaffen. Sprich das gern mit deiner SL ab.</div>
    ${status("Drachenahn gewählt","Wähle eine Drachenfarbe.")}
    <div class="grid">${DRAGONS.map(([c,t,d])=>opt(S.dragon===c,false,c,t+"schaden",d,`S.dragon='${c}';save();render()`)).join("")}</div>${nav()}</div>`;
  }
  if(i===5){
    const ks=knownSkills(); const r=RACES[S.race];
    const fixed=new Set([...(BGS[S.bg]?.s||[]),...(r?.skills||[])]);
    h=`<div class="card"><h2>Schritt 6: Fertigkeiten</h2><p class="lead">Fertigkeiten sind Dinge, in denen du geübt bist. Auf Proben damit addierst du deinen Übungsbonus (+${PB()}). Wähle <b>zwei</b> aus der Liste der Zauberin.</p>
    ${fixed.size?`<div class="tip">Schon geübt durch Volk oder Hintergrund: <b>${[...fixed].join(", ")}</b></div>`:""}
    ${status("Zwei Fertigkeiten gewählt",`Wähle noch ${2-S.skills.length} Fertigkeit(en).`)}
    <div class="grid">${CLASS_SKILLS.map(n=>{const isF=fixed.has(n);const a=SKILLS.find(s=>s[0]===n)[1];
      return opt(S.skills.includes(n)||isF,isF||(!S.skills.includes(n)&&S.skills.length>=2),n+(n==="Überzeugen"?TIP:""),ABN[a]+(isF?" · schon geübt":""),SKILL_INFO[n],`toggle('skills','${n}',2)`);}).join("")}</div>
    ${r&&r.extraSkills?`<h2 style="margin-top:16px;font-size:16px">Halbelf: zwei Bonus-Fertigkeiten (frei wählbar)</h2><div class="grid">${SKILLS.map(([n,a])=>{const has=fixed.has(n)||S.skills.includes(n);return opt(S.extraSkills.includes(n)||has,has||(!S.extraSkills.includes(n)&&S.extraSkills.length>=2),n,ABN[a],"",`toggle('extraSkills','${n}',2)`);}).join("")}</div>`:""}
    ${nav()}</div>`;
  }
  if(i===6){
    const n=CANTRIPS_KNOWN[L()];
    h=`<div class="card"><h2>Schritt 7: Zaubertricks</h2><p class="lead">Zaubertricks kosten nichts, du kannst sie <b>unbegrenzt</b> wirken. Wähle <b>${n}</b>. Faustregel: zwei zum Angreifen, der Rest für Erkundung und Alltag.</p>
    ${status(n+" Zaubertricks gewählt",`Gewählt: ${S.cantrips.length} von ${n}.`)}
    <div class="grid">${SPELLS.filter(s=>s[1]===0).map(s=>spellOpt(s,"cantrips",n)).join("")}</div>${nav()}</div>`;
  }
  if(i===7){
    const n=SPELLS_KNOWN[L()],mx=MAXLVL[L()];
    h=`<div class="card"><h2>Schritt 8: Zauber</h2><p class="lead">Diese Zauber kosten einen <b>Zauberplatz</b>. Auf Stufe ${L()} kennst du <b>${n}</b> Zauber bis Grad ${mx}. Du kannst einen Zauber auch mit einem höheren Platz wirken, dann wird er stärker.</p>
    <div class="tip">${TIP} Nimm mindestens <b>einen Schutzzauber</b> (Schild oder Nebelschritt) und <b>einen starken Angriff</b>. Zauber mit <b>Konzentration</b> (K) laufen nur einzeln: Startest du einen zweiten, endet der erste. Wirst du getroffen, machst du einen KON-Rettungswurf, um die Konzentration zu halten.</div>
    ${status(n+" Zauber gewählt",`Gewählt: ${S.spells.length} von ${n}.`)}
    ${[1,2,3].filter(g=>g<=mx).map(g=>`<h2 style="font-size:16px;margin-top:12px">Grad ${g}</h2><div class="grid">${SPELLS.filter(s=>s[1]===g).map(s=>spellOpt(s,"spells",n)).join("")}</div>`).join("")}
    ${nav()}</div>`;
  }
  if(i===8){
    h=`<div class="card"><h2>Schritt 9: Metamagie</h2>`+(L()<3?`<p class="lead">Metamagie bekommst du erst ab <b>Stufe 3</b>. Dieser Schritt ist für dich erledigt.</p>`:
    `<p class="lead">Mit <b>Zauberpunkten</b> (auf Stufe ${L()}: ${L()} Stück) kannst du Zauber verändern. Wähle <b>zwei</b> Metamagie-Optionen. Die Punkte kommen nach einer langen Rast zurück.</p>
    ${status("Zwei Optionen gewählt",`Gewählt: ${S.meta.length} von 2.`)}
    <div class="grid">${META.map(m=>opt(S.meta.includes(m[0]),!S.meta.includes(m[0])&&S.meta.length>=2,m[1]+(m[5]?TIP:"")+` <small>${m[2]}</small>`,m[3],m[4],`toggle('meta','${m[0]}',2)`)).join("")}</div>`)+nav()+`</div>`;
  }
  if(i===9){
    h=`<div class="card"><h2>Schritt 10: Ausrüstung</h2><p class="lead">Wähle jeweils eine Option. Dazu bekommst du immer <b>zwei Dolche</b> und die Ausrüstung deines Hintergrunds.</p>
    ${status("Ausrüstung gewählt","Wähle in jeder Zeile eine Option.")}
    ${EQUIP.map(([k,os])=>`<div class="grid" style="margin-bottom:10px">${os.map(o=>opt(S.equip[k]===o[0],false,o[1]+(o[3]?TIP:""),"",o[2],`S.equip['${k}']='${o[0]}';save();render()`)).join("")}</div>`).join("")}
    ${nav()}</div>`;
  }
  if(i===10){
    h=`<div class="card"><h2>Schritt 11: Aussehen und Geschichte</h2><p class="lead">Optional, aber schön: Wer bist du? Ein paar Stichworte reichen.</p>
    <div class="tip">Fragen zum Nachdenken: Woran merkt man dein Drachenblut (Augen, Schuppen, Wärme)? Wovon träumst du? Warum bist du auf Stormwreck Isle? Was willst du unbedingt erreichen?</div>
    <div class="field"><label>Aussehen</label><textarea oninput="S.appearance=this.value;save()">${esc(S.appearance)}</textarea></div>
    <div class="field"><label>Persönlichkeit und Geschichte</label><textarea style="min-height:130px" oninput="S.story=this.value;save()">${esc(S.story)}</textarea></div>
    ${nav()}</div>`;
  }
  if(i===11){ w.style.display="none"; renderSheet(); return; }
  w.innerHTML=h;
}
function spellOpt(s,list,n){
  const [id,g,de,en,time,range,txt,tip,conc]=s; const sel=S[list].includes(id);
  return opt(sel,!sel&&S[list].length>=n,de+(tip?TIP:"")+` <small>${en}</small>`,`${time} · ${range}${conc?" · K":""}`,txt,`toggle('${list}','${id}',${n})`);
}
function recommend(){S.scores={cha:15,con:14,dex:13,wis:12,int:10,str:8};S.fb={two:"cha",one:"con",one2:"dex"};if(S.boni==="phb"&&RACES[S.race]&&RACES[S.race].choose)S.halfelf=["con","dex"];save();render();}
function toggle(list,v,max){const a=S[list];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<max)a.push(v);save();render();}
function trimChoices(){S.cantrips=S.cantrips.slice(0,CANTRIPS_KNOWN[L()]);S.spells=S.spells.filter(id=>SP[id][1]<=MAXLVL[L()]).slice(0,SPELLS_KNOWN[L()]);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ================= BOGEN ================= */
function renderSheet(){
  const host=document.getElementById("sheetHost");

  const dex=mod(sc("dex")),con=mod(sc("con")),cha=mod(sc("cha")),wis=mod(sc("wis"));
  const dc=8+P+cha, atk=P+cha, hpm=hpMax();
  const dr=DRAGONS.find(d=>d[0]===S.dragon)||["–","–"];
  if(S.hp===""||S.hp===undefined) S.hp=hpm;
  if(S.hd===""||S.hd===undefined) S.hd=L();
  const spMax=L()>=2?L():0;
  const abl=AB.map(([k,de,ab])=>{const v=sc(k),m=mod(v),save=["con","cha"].includes(k);
    const sk=SKILLS.filter(s=>s[1]===k).map(([n])=>`<div class="ln"><span class="p ${ks.has(n)?"on":""}"></span><span class="v">${sg(m+(ks.has(n)?P:0))}</span>${n}</div>`).join("");
    return `<div class="abl"><div class="h"><span>${ab} ${de}</span><span><span class="sv">${v}</span> <span class="mod">${sg(m)}</span></span></div><div class="ln"><span class="p ${save?"on":""}"></span><span class="v">${sg(m+(save?P:0))}</span>Rettungswurf</div>${sk}</div>`;}).join("");
  const spCard=(ids)=>ids.map(id=>{const [,g,de,en,time,range,txt,,conc]=SP[id];return `<div class="sp"><div class="t"><span>${de} <span style="font-weight:400;color:var(--tx3);font-size:10.5px">${en}</span></span><small>${time} · ${range}${conc?" · K":""}</small></div><p>${txt}</p></div>`;}).join("");
  const slots=(SLOTS[L()]||[]).map((n,g)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><b style="width:52px;font-size:12px;color:var(--ac-ink)">Grad ${g+1}</b><div class="dots">${Array.from({length:n},(_,i)=>`<input type="checkbox" class="dot" data-vol ${S.slotsUsed[g+"_"+i]?"":"checked"} onchange="S.slotsUsed['${g}_${i}']=!this.checked;save()">`).join("")}</div></div>`).join("");
  const spDots=spMax?Array.from({length:spMax},(_,i)=>`<input type="checkbox" class="dot" data-vol ${i<spMax-(S.spUsed||0)?"checked":""} onchange="S.spUsed=${spMax}-this.parentNode.querySelectorAll('input:checked').length;save()">`).join(""):"<span style='font-size:11px;color:var(--tx3)'>ab Stufe 2</span>";
  const weapon=S.equip.w==="stab"?["Kampfstab",sg(P+mod(sc("str"))),"1W6 "+sg(mod(sc("str")))+" Wucht (beidhändig 1W8)"]:["Leichte Armbrust",sg(P+dex),"1W8 "+sg(dex)+" Stich · 80/320 ft · Laden"];
  const atkCantrips=S.cantrips.filter(id=>/Zauberangriff|Rettungswurf/.test(SP[id][6])).map(id=>{const s=SP[id];const save=/Rettungswurf/.test(s[6])&&!/Zauberangriff/.test(s[6]);return `<tr><td><b>${s[2]}</b></td><td>${save?"SG "+dc:sg(atk)}</td><td>${s[6].replace(/^Zauberangriff[^:]*: /,"").split(". ")[0]} · ${s[5]}</td></tr>`;}).join("");
  const metaTxt=S.meta.map(id=>{const m=META.find(x=>x[0]===id);return `<div class="ft"><b>${m[1]}</b> (${m[3]})<p>${m[4]}</p></div>`;}).join("");
  const eq=[EQUIP[0][1].find(o=>o[0]===S.equip.w),EQUIP[1][1].find(o=>o[0]===S.equip.f),EQUIP[2][1].find(o=>o[0]===S.equip.p)].filter(Boolean).map(o=>o[1]);
  const langs=["Gemeinsprache","Drakonisch"].concat(r.lang||[]).concat(b.l?[`+${b.l} Sprache(n) aus dem Hintergrund`]:[]);
  host.innerHTML=`<div class="sheet">
  <div class="card noprint"><h2>Dein Bogen</h2>
   ${missing.length?`<p class="status no">Noch offen: ${missing.join(", ")}. Der Bogen zeigt bis dahin Platzhalter.</p>`:`<p class="status ok">✓ Alles gewählt. Dein Charakter ist fertig!</p>`}
   <div class="sheet-tools"><button class="btn sec" onclick="go(10)">← Zurück zum Guide</button>
   <button class="btn" onclick="doPrint(false)">Drucken (ausgefüllt)</button><button class="btn" onclick="doPrint(true)">Drucken für Stift &amp; Papier</button>
   <button class="btn pu" onclick="longRest()">Lange Rast</button>
   <button class="btn sec" onclick="dl()">Stand herunterladen</button><button class="btn sec" onclick="document.getElementById('up').click()">Stand laden</button><input type="file" id="up" hidden accept=".json" onchange="ul(this)"></div>
   <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:6px"><label><input type="checkbox" ${S.pNotes!==false?"checked":""} onchange="S.pNotes=this.checked;save()"> Notizseite mitdrucken</label><label><input type="checkbox" ${S.pApp!==false?"checked":""} onchange="S.pApp=this.checked;save()"> Anhang mit ausführlichen Zaubertexten</label></div>
   <p class="lead" style="margin:0;font-size:12.5px">Ausdruck: Seite 1 ist zum Spielen (Werte, TP, Zauberplätze, Zauber, Kampfnotizen), Seite 2 enthält Charakter, Merkmale und Ausrüstung, Seite 3 ist eine Notizseite, danach folgt der Zauberanhang. „Für Stift &amp; Papier“ lässt TP, temporäre TP, Trefferwürfel, Münzen und Zustände leer. Zauberplätze und Zauberpunkte sind immer leere Kreise zum Abhaken.</p></div>
  <div class="banner"><h1>${esc(S.name)||"Name"}</h1><div class="meta">Zauberin Stufe ${L()} · Drakonische Blutlinie (${dr[0]}, ${dr[1]}) · ${r.n} · ${b.n}${S.player?" · Spielerin: "+esc(S.player):""}</div></div>
  <div class="scols">
   <div>
    <div class="sc"><h3>Attribute · Übung +${P}</h3>${abl}</div>
